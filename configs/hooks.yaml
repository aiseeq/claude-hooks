# Конфигурация claude-hooks

logger:
  level: "info" # debug, info, warn, error
  format: "text" # text, json
  output: "file" # stdout, stderr, file
  file: "~/.claude/logs/claude-hooks.log"
  max_size_mb: 16 # ротация лога при превышении размера, 0 — отключить

tools:
  # Блокирует отправку комментария в Jira с маркерами агентского стиля
  # (длинное тире, markdown, «», «X, а не Y», приветствие, числа прописью) —
  # текст обязан пройти через скилл write-as-user
  jira_style:
    enabled: true

  # Блокирует kill/pkill/killall, цель которых вычисляется при запуске ($p, $(…), xargs)
  # или задевает сессию: PID ≤ 1, systemd и графическая оболочка, предки claude,
  # оболочка самой команды (pkill -f по шаблону, совпадающему с текстом команды)
  kill_guard:
    enabled: true

  # Кладёт агенту diff правки SKILL.md, CLAUDE.md или AGENTS.md, сделанной после того,
  # как текст попал ему в контекст; правка больше 2 КБ — просьба перечитать с
  # перечнем разделов (UserPromptSubmit, PostToolBatch). Без ключа включено
  skill_reload:
    enabled: true

  # Блокирует явный выбор модели, отсутствующей в ~/.config/models/approved
  model_guard:
    enabled: false

  # Отклоняет rm/rmdir, на которые Claude Code сам спросит пользователя
  # («Dangerous rm operation on possibly-empty variable path», даже в bypass):
  # rm -f $S/*, "$1"/*, $X/tmp, rm -rf "$D" после D=$(pwd). Агент получает
  # переписанную форму rm -f "${S:?}"/* и запрос пользователю не всплывает.
  # То же для относительного глоба после cd («statically-unresolvable target»):
  # cd X && rm -f cl/* — агенту подсказка указать литеральный абсолютный путь
  rm_guard:
    enabled: true

  # Отклоняет запись файла через here-doc, тело которого Claude Code проверит
  # как команды и спросит пользователя: строка вида rm -rf $X/* в теле here-doc
  # внутри { … }, ( … ), if, for, case, функции или в команде длиннее 10000
  # символов. Агент получает подсказку создать файл инструментом Write
  write_guard:
    enabled: true

  # Уведомления: Claude Code закончил работу или ждёт ответа
  notifier:
    enabled: true
    sound: true
    desktop: true
    # Клик по уведомлению переводит фокус на окно терминала (KDE Plasma, X11 и Wayland)
    activate_on_click: true
