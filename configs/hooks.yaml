# Конфигурация claude-hooks

logger:
  level: "info" # debug, info, warn, error
  format: "text" # text, json
  output: "file" # stdout, stderr, file
  file: "~/.claude/logs/claude-hooks.log"
  max_size_mb: 16 # ротация лога при превышении размера, 0 — отключить

tools:
  # Блокирует отправку комментария в Jira с маркерами агентского стиля
  # (длинное тире, markdown, «», «X, а не Y», приветствие, числа прописью) —
  # текст обязан пройти через скилл write-as-user
  jira_style:
    enabled: true

  # Уведомления: Claude Code закончил работу или ждёт ответа
  notifier:
    enabled: true
    sound: true
    desktop: true
    # Клик по уведомлению переводит фокус на окно терминала (KDE Plasma, X11 и Wayland)
    activate_on_click: true
